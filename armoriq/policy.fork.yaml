# mirrors the policy active on platform.armoriq.ai
name: fork-treasury
version: v0.2.0
scope:
  target_type: mcp
  target: 4599b2ea-0729-4f9b-ac22-d6742745a48e
  caller: all
default_action: block
priority: 50
rules:
  - tool: get_treasury_balance
    action: allow
  - tool: list_invoices
    action: allow
  - tool: get_vendor
    action: allow
  - tool: get_sandbox_messages
    action: allow
  - tool: get_payment_receipt
    action: allow
  - tool: execute_payment
    action: allow
  - tool: execute_large_payment
    action: hold
  - tool: update_vendor_destination
    action: block
